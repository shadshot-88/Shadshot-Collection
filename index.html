<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shadshot Collection</title>
  <style>
    :root {
      --bg: #07070a;
      --panel: rgba(18, 18, 24, 0.92);
      --panel-2: rgba(24, 24, 32, 0.96);
      --text: #f5f7ff;
      --muted: #a4a8b8;
      --border: rgba(255, 255, 255, 0.14);
      --red: #ff3b30;
      --gold: #ffb347;
      --glow: rgba(255, 59, 48, 0.18);
      --glow-2: rgba(255, 179, 71, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 59, 48, 0.16), transparent 26%),
        radial-gradient(circle at 80% 18%, rgba(255, 179, 71, 0.10), transparent 18%),
        radial-gradient(circle at 0% 100%, rgba(255, 59, 48, 0.08), transparent 22%),
        linear-gradient(180deg, #0b0b10 0%, #09090d 55%, #060608 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 42px 42px;
      opacity: 0.22;
      mask-image: linear-gradient(180deg, rgba(0,0,0,0.7), transparent);
    }

    .wrap {
      width: min(1240px, calc(100% - 28px));
      margin: 0 auto;
      padding: 34px 0 56px;
    }

    header {
      text-align: center;
      padding: 18px 12px 30px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
      color: #e7e9f5;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 18px;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.03) inset;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--red), var(--gold));
      box-shadow: 0 0 16px rgba(255, 59, 48, 0.8);
    }

    h1 {
      font-size: clamp(2.2rem, 5vw, 4.1rem);
      line-height: 0.98;
      letter-spacing: 0.02em;
      text-shadow:
        0 0 18px rgba(255, 59, 48, 0.16),
        0 0 36px rgba(255, 179, 71, 0.08);
    }

    .subtitle {
      margin-top: 12px;
      color: var(--muted);
      font-size: 1rem;
    }

    .featured-section {
      margin: 24px auto 42px;
      position: relative;
    }

    .featured-label {
      text-align: center;
      color: #d6d9e8;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.34em;
      margin-bottom: 14px;
    }

    .featured-card {
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      padding: 30px 20px 26px;
      border: 1px solid var(--border);
      background:
        radial-gradient(circle at 50% 35%, rgba(255, 179, 71, 0.08), transparent 32%),
        radial-gradient(circle at 50% 0%, rgba(255, 59, 48, 0.20), transparent 30%),
        linear-gradient(180deg, rgba(26, 26, 34, 0.96), rgba(15, 15, 20, 0.96));
      box-shadow:
        0 18px 50px rgba(0, 0, 0, 0.48),
        0 0 0 1px rgba(255,255,255,0.03) inset,
        0 0 42px rgba(255, 59, 48, 0.08);
      min-height: 290px;
    }

    .featured-card::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 28px;
      padding: 2px;
      background: linear-gradient(135deg, rgba(255,59,48,0.55), rgba(255,179,71,0.45), rgba(255,59,48,0.45));
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
              mask-composite: exclude;
      opacity: 0.45;
      pointer-events: none;
    }

    .featured-card::after {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(255, 179, 71, 0.10);
      box-shadow:
        0 0 0 12px rgba(255, 59, 48, 0.03),
        0 0 60px rgba(255, 179, 71, 0.06);
      pointer-events: none;
      opacity: 0.7;
    }

    .featured-inner {
      position: relative;
      z-index: 1;
      max-width: 860px;
      margin: 0 auto;
      text-align: center;
      padding: 6px 10px;
    }

    .featured-kicker {
      color: #c9cedf;
      font-size: 12px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .featured-name {
      font-size: clamp(1.75rem, 4vw, 3rem);
      line-height: 1.04;
      letter-spacing: 0.03em;
      text-wrap: balance;
      text-shadow:
        0 0 20px rgba(255, 59, 48, 0.16),
        0 0 30px rgba(255, 179, 71, 0.10);
    }

    .featured-meta {
      margin-top: 18px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.10);
      color: #edf0fb;
      font-size: 13px;
      backdrop-filter: blur(8px);
    }

    .pill strong {
      color: #fff;
      font-weight: 700;
    }

    .hint {
      margin-top: 20px;
      color: #aab0c5;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .featured-ornament {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      margin: 2px auto 16px;
      background:
        radial-gradient(circle at center, rgba(255,255,255,0.88) 0 10%, rgba(255,179,71,0.82) 10% 19%, rgba(255,59,48,0.18) 19% 40%, transparent 40%),
        radial-gradient(circle at center, rgba(255,59,48,0.55), rgba(255,179,71,0.08) 68%, transparent 71%);
      box-shadow:
        0 0 0 10px rgba(255, 59, 48, 0.05),
        0 0 28px rgba(255, 59, 48, 0.18),
        0 0 54px rgba(255, 179, 71, 0.10);
      opacity: 0.86;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin: 0 0 18px;
    }

    .section-head h2 {
      font-size: clamp(1.45rem, 2.6vw, 2rem);
      letter-spacing: 0.02em;
    }

    .count {
      color: var(--muted);
      font-size: 14px;
    }

    .controls {
      display: grid;
      grid-template-columns: 2.2fr 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    input,
    select {
      width: 100%;
      padding: 13px 14px;
      background: rgba(18, 18, 24, 0.92);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      outline: none;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.02) inset;
    }

    input::placeholder {
      color: #8f95a8;
    }

    input:focus,
    select:focus {
      border-color: rgba(255, 179, 71, 0.45);
      box-shadow: 0 0 0 4px rgba(255, 179, 71, 0.08);
    }

    .car-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }

    .car-card {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      padding: 18px 18px 16px;
      background:
        radial-gradient(circle at top left, rgba(255, 59, 48, 0.07), transparent 36%),
        linear-gradient(180deg, rgba(22, 22, 28, 0.96), rgba(15, 15, 20, 0.96));
      border: 1px solid rgba(255, 255, 255, 0.11);
      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.28),
        0 0 0 1px rgba(255,255,255,0.02) inset;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      min-height: 164px;
    }

    .car-card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 179, 71, 0.36);
      box-shadow:
        0 14px 36px rgba(0, 0, 0, 0.36),
        0 0 24px rgba(255, 59, 48, 0.08);
    }

    .car-card h3 {
      font-size: 1.05rem;
      line-height: 1.28;
      letter-spacing: 0.02em;
      margin-bottom: 12px;
      text-shadow: 0 0 16px rgba(255, 255, 255, 0.08);
    }

    .car-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
      color: #c5cad9;
      font-size: 13px;
    }

    .car-info span strong {
      color: #fff;
    }

    .loading,
    .error,
    .no-results {
      text-align: center;
      padding: 40px 18px;
      color: var(--muted);
    }

    .error {
      color: #ff8b82;
    }

    footer {
      text-align: center;
      padding: 24px 10px 6px;
      color: #73788a;
      font-size: 12px;
    }

    @media (max-width: 920px) {
      .controls {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 560px) {
      .wrap {
        width: min(100% - 18px, 1240px);
        padding-top: 18px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .car-grid {
        grid-template-columns: 1fr;
      }

      .featured-card {
        min-height: 250px;
        padding: 22px 14px 18px;
      }

      .featured-card::after {
        width: 190px;
        height: 190px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="badge"><span class="badge-dot"></span> SHADSHOT COLLECTION</div>
      <h1>Shadshot Collection</h1>
      <p class="subtitle">My die-cast car collection</p>
    </header>

    <section class="featured-section">
      <div class="featured-label">Today's Car</div>
      <div class="featured-card" id="featuredCard">
        <div class="loading">Loading collection...</div>
      </div>
    </section>

    <section class="collection">
      <div class="section-head">
        <h2>My Collection</h2>
        <div class="count" id="collectionCount">Loading...</div>
      </div>

      <div class="controls">
        <input type="text" id="search" placeholder="Search cars..." />
        <select id="manufacturerFilter">
          <option value="">All Manufacturers</option>
        </select>
        <select id="brandFilter">
          <option value="">All Car Brands</option>
        </select>
        <select id="colorFilter">
          <option value="">All Colors</option>
        </select>
      </div>

      <div id="carGrid" class="car-grid">
        <div class="loading">Loading cars...</div>
      </div>
    </section>

    <footer>Use ← / → to change the featured car</footer>
  </div>

  <script>
    let cars = [];
    let displayedCars = [];
    let featuredOrder = [];
    let featuredDeckIndex = 0;

    const STORAGE_ORDER = "shadshotFeaturedOrder";
    const STORAGE_NEXT_INDEX = "shadshotFeaturedNextIndex";

    const csvPath = "Collection.csv";

    async function loadCSV() {
      try {
        const response = await fetch(csvPath, { cache: "no-store" });
        if (!response.ok) throw new Error("Could not load Collection.csv");

        const csvText = await response.text();
        cars = parseCSV(csvText);

        if (!cars.length) throw new Error("No cars found in CSV");

        displayedCars = [...cars];

        setupFilters();
        ensureFeaturedOrder();
        initFeaturedFromStorage();
        renderFeaturedCar();
        renderCars();
      } catch (error) {
        console.error(error);

        document.getElementById("featuredCard").innerHTML = `
          <div class="error">
            Could not load your collection.<br><br>
            Make sure <strong>Collection.csv</strong> is in the same folder as <strong>index.html</strong>.
          </div>
        `;

        document.getElementById("carGrid").innerHTML = `
          <div class="error">Could not load Collection.csv.</div>
        `;
      }
    }

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let value = "";
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"' && insideQuotes && nextChar === '"') {
          value += '"';
          i++;
        } else if (char === '"') {
          insideQuotes = !insideQuotes;
        } else if (char === "," && !insideQuotes) {
          row.push(value.trim());
          value = "";
        } else if ((char === "\n" || char === "\r") && !insideQuotes) {
          if (char === "\r" && nextChar === "\n") i++;
          row.push(value.trim());
          value = "";
          if (row.some(cell => cell !== "")) rows.push(row);
          row = [];
        } else {
          value += char;
        }
      }

      if (value !== "" || row.length > 0) {
        row.push(value.trim());
        if (row.some(cell => cell !== "")) rows.push(row);
      }

      if (rows.length < 2) return [];

      const headers = rows[0].map(h =>
        h.replace(/^\uFEFF/, "").trim().toLowerCase()
      );

      return rows.slice(1).map(row => {
        const data = {};
        headers.forEach((header, index) => {
          data[header] = row[index] || "";
        });

        return {
          name: data["car name"] || data["cars"] || "",
          manufacturer: data["manufacturer"] || "",
          color: data["color"] || "",
          carBrand: data["car brand"] || data["carbrand"] || "",
        };
      }).filter(car => car.name !== "");
    }

    function ensureFeaturedOrder() {
      const saved = localStorage.getItem(STORAGE_ORDER);
      let order = [];

      if (saved) {
        try {
          order = JSON.parse(saved);
        } catch {
          order = [];
        }
      }

      const valid =
        Array.isArray(order) &&
        order.length === cars.length &&
        order.every(n => Number.isInteger(n) && n >= 0 && n < cars.length);

      if (!valid) {
        featuredOrder = shuffle([...Array(cars.length).keys()]);
        localStorage.setItem(STORAGE_ORDER, JSON.stringify(featuredOrder));
        localStorage.setItem(STORAGE_NEXT_INDEX, "0");
      } else {
        featuredOrder = order;
      }
    }

    function initFeaturedFromStorage() {
      const savedNext = parseInt(localStorage.getItem(STORAGE_NEXT_INDEX) || "0", 10);
      featuredDeckIndex = Number.isFinite(savedNext) ? savedNext : 0;
      featuredDeckIndex = clampIndex(featuredDeckIndex);
    }

    function clampIndex(index) {
      if (!featuredOrder.length) return 0;
      return ((index % featuredOrder.length) + featuredOrder.length) % featuredOrder.length;
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function currentFeaturedCar() {
      if (!cars.length || !featuredOrder.length) return null;
      const realIndex = featuredOrder[featuredDeckIndex];
      return cars[realIndex];
    }

    function moveFeatured(step) {
      if (!cars.length || !featuredOrder.length) return;

      featuredDeckIndex = clampIndex(featuredDeckIndex + step);
      const nextIndex = clampIndex(featuredDeckIndex + 1);

      localStorage.setItem(STORAGE_NEXT_INDEX, String(nextIndex));
      renderFeaturedCar();
    }

    function renderFeaturedCar() {
      const featuredCar = currentFeaturedCar();
      if (!featuredCar) return;

      document.getElementById("featuredCard").innerHTML = `
        <div class="featured-inner">
          <div class="featured-ornament" aria-hidden="true"></div>
          <div class="featured-kicker">Featured Collection Car</div>
          <div class="featured-name">${escapeHTML(featuredCar.name)}</div>
          <div class="featured-meta">
            ${featuredCar.manufacturer ? `<div class="pill"><strong>Manufacturer:</strong> ${escapeHTML(featuredCar.manufacturer)}</div>` : ""}
            ${featuredCar.carBrand ? `<div class="pill"><strong>Brand:</strong> ${escapeHTML(featuredCar.carBrand)}</div>` : ""}
            ${featuredCar.color ? `<div class="pill"><strong>Color:</strong> ${escapeHTML(featuredCar.color)}</div>` : ""}
          </div>
          <div class="hint">Use ← / → to change featured car</div>
        </div>
      `;
    }

    function setupFilters() {
      const manufacturers = [...new Set(cars.map(car => car.manufacturer).filter(Boolean))].sort();
      const brands = [...new Set(cars.map(car => car.carBrand).filter(Boolean))].sort();
      const colors = [...new Set(cars.map(car => car.color).filter(Boolean))].sort();

      fillSelect("manufacturerFilter", manufacturers);
      fillSelect("brandFilter", brands);
      fillSelect("colorFilter", colors);

      document.getElementById("search").addEventListener("input", applyFilters);
      document.getElementById("manufacturerFilter").addEventListener("change", applyFilters);
      document.getElementById("brandFilter").addEventListener("change", applyFilters);
      document.getElementById("colorFilter").addEventListener("change", applyFilters);
    }

    function fillSelect(id, values) {
      const select = document.getElementById(id);
      values.forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      });
    }

    function applyFilters() {
      const search = document.getElementById("search").value.toLowerCase().trim();
      const manufacturer = document.getElementById("manufacturerFilter").value;
      const brand = document.getElementById("brandFilter").value;
      const color = document.getElementById("colorFilter").value;

      displayedCars = cars.filter(car => {
        const matchesSearch =
          !search ||
          car.name.toLowerCase().includes(search) ||
          car.manufacturer.toLowerCase().includes(search) ||
          car.carBrand.toLowerCase().includes(search) ||
          car.color.toLowerCase().includes(search);

        const matchesManufacturer = !manufacturer || car.manufacturer === manufacturer;
        const matchesBrand = !brand || car.carBrand === brand;
        const matchesColor = !color || car.color === color;

        return matchesSearch && matchesManufacturer && matchesBrand && matchesColor;
      });

      renderCars();
    }

    function renderCars() {
      const grid = document.getElementById("carGrid");
      document.getElementById("collectionCount").textContent = `${displayedCars.length} cars`;

      if (displayedCars.length === 0) {
        grid.innerHTML = `<div class="no-results">No cars found.</div>`;
        return;
      }

      grid.innerHTML = displayedCars.map(car => `
        <div class="car-card">
          <h3>${escapeHTML(car.name)}</h3>
          <div class="car-info">
            ${car.manufacturer ? `<span><strong>Manufacturer:</strong> ${escapeHTML(car.manufacturer)}</span>` : ""}
            ${car.carBrand ? `<span><strong>Brand:</strong> ${escapeHTML(car.carBrand)}</span>` : ""}
            ${car.color ? `<span><strong>Color:</strong> ${escapeHTML(car.color)}</span>` : ""}
          </div>
        </div>
      `).join("");
    }

    function escapeHTML(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    document.addEventListener("keydown", (e) => {
      const tag = document.activeElement?.tagName?.toLowerCase();
      const typing =
        tag === "input" ||
        tag === "select" ||
        tag === "textarea" ||
        document.activeElement?.isContentEditable;

      if (typing) return;

      if (e.key === "ArrowRight") {
        e.preventDefault();
        moveFeatured(1);
      }

      if (e.key === "ArrowLeft") {
        e.preventDefault();
        moveFeatured(-1);
      }
    });

    loadCSV();
  </script>
</body>
</html>
