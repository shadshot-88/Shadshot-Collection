<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shadshot Collection</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #0f0f0f;
            color: #ffffff;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 40px 20px 25px;
        }

        header h1 {
            font-size: 36px;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        header p {
            color: #aaaaaa;
            font-size: 15px;
        }

        .featured-section {
            max-width: 900px;
            margin: 20px auto 45px;
            padding: 0 20px;
        }

        .featured-label {
            text-align: center;
            color: #999999;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .featured-card {
            background: #1b1b1b;
            border: 1px solid #333333;
            border-radius: 18px;
            padding: 35px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
        }

        .featured-card h2 {
            font-size: 30px;
            margin-bottom: 20px;
        }

        .details {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tag {
            background: #292929;
            border-radius: 20px;
            padding: 8px 14px;
            color: #dddddd;
            font-size: 13px;
        }

        .new-car-btn {
            margin-top: 25px;
            padding: 12px 22px;
            border: none;
            border-radius: 25px;
            background: #ffffff;
            color: #111111;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .new-car-btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .collection {
            max-width: 1200px;
            margin: auto;
            padding: 0 20px 50px;
        }

        .collection-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .collection-header h2 {
            font-size: 24px;
        }

        .count {
            color: #999999;
            font-size: 14px;
        }

        .controls {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 25px;
        }

        input,
        select {
            width: 100%;
            padding: 12px 14px;
            background: #1b1b1b;
            border: 1px solid #333333;
            border-radius: 10px;
            color: #ffffff;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #666666;
        }

        .car-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 15px;
        }

        .car-card {
            background: #191919;
            border: 1px solid #2d2d2d;
            border-radius: 14px;
            padding: 20px;
            transition: 0.2s;
        }

        .car-card:hover {
            transform: translateY(-3px);
            border-color: #555555;
        }

        .car-card h3 {
            font-size: 17px;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .car-info {
            display: flex;
            flex-direction: column;
            gap: 7px;
            color: #aaaaaa;
            font-size: 13px;
        }

        .car-info span strong {
            color: #dddddd;
        }

        .loading,
        .error,
        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: #999999;
        }

        .error {
            color: #ff7777;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #666666;
            font-size: 12px;
        }

        @media (max-width: 800px) {
            .controls {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 500px) {
            header h1 {
                font-size: 28px;
            }

            .featured-card {
                padding: 25px 15px;
            }

            .featured-card h2 {
                font-size: 23px;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            .car-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Shadshot Collection</h1>
    <p>My die-cast car collection</p>
</header>


<section class="featured-section">

    <div class="featured-label">
        Today's Car
    </div>

    <div class="featured-card" id="featuredCard">
        <div class="loading">
            Loading collection...
        </div>
    </div>

</section>


<section class="collection">

    <div class="collection-header">
        <h2>My Collection</h2>
        <div class="count" id="collectionCount">
            Loading...
        </div>
    </div>


    <div class="controls">

        <input
            type="text"
            id="search"
            placeholder="Search cars..."
        >

        <select id="manufacturerFilter">
            <option value="">All Manufacturers</option>
        </select>

        <select id="brandFilter">
            <option value="">All Car Brands</option>
        </select>

        <select id="colorFilter">
            <option value="">All Colors</option>
        </select>

    </div>


    <div id="carGrid" class="car-grid">
        <div class="loading">
            Loading cars...
        </div>
    </div>

</section>


<footer>
    Shadshot Collection
</footer>


<script>

    let cars = [];
    let displayedCars = [];


    /*
        ----------------------------------------------------
        CSV READER
        ----------------------------------------------------
    */

    async function loadCSV() {

        try {

            const response = await fetch("Collection.csv");

            if (!response.ok) {
                throw new Error("Could not load Collection.csv");
            }

            const csvText = await response.text();

            cars = parseCSV(csvText);

            if (cars.length === 0) {
                throw new Error("No cars were found in Collection.csv");
            }

            displayedCars = [...cars];

            setupFilters();

            showFeaturedCar();

            renderCars();

        } catch (error) {

            console.error(error);

            document.getElementById("featuredCard").innerHTML =
                `<div class="error">
                    Could not load your collection.<br><br>
                    Make sure <strong>Collection.csv</strong> is in the same GitHub folder as index.html.
                </div>`;

            document.getElementById("carGrid").innerHTML =
                `<div class="error">
                    Could not load Collection.csv.
                </div>`;
        }
    }


    /*
        ----------------------------------------------------
        CSV PARSER
        ----------------------------------------------------
    */

    function parseCSV(text) {

        const rows = [];
        let row = [];
        let value = "";
        let insideQuotes = false;

        for (let i = 0; i < text.length; i++) {

            const char = text[i];
            const nextChar = text[i + 1];

            if (char === '"' && insideQuotes && nextChar === '"') {

                value += '"';
                i++;

            } else if (char === '"') {

                insideQuotes = !insideQuotes;

            } else if (char === "," && !insideQuotes) {

                row.push(value.trim());
                value = "";

            } else if ((char === "\n" || char === "\r") && !insideQuotes) {

                if (char === "\r" && nextChar === "\n") {
                    i++;
                }

                row.push(value.trim());
                value = "";

                if (row.some(cell => cell !== "")) {
                    rows.push(row);
                }

                row = [];

            } else {

                value += char;
            }
        }

        if (value !== "" || row.length > 0) {

            row.push(value.trim());

            if (row.some(cell => cell !== "")) {
                rows.push(row);
            }
        }


        if (rows.length < 2) {
            return [];
        }


        const headers = rows[0].map(header =>
            header
                .replace(/^\uFEFF/, "")
                .trim()
                .toLowerCase()
        );


        return rows.slice(1).map(row => {

            const data = {};

            headers.forEach((header, index) => {
                data[header] = row[index] || "";
            });


            return {

                name:
                    data["car name"] ||
                    data["cars"] ||
                    "",

                manufacturer:
                    data["manufacturer"] ||
                    "",

                color:
                    data["color"] ||
                    "",

                carBrand:
                    data["car brand"] ||
                    ""

            };

        }).filter(car => car.name !== "");

    }


    /*
        ----------------------------------------------------
        RANDOM CAR SYSTEM
        ----------------------------------------------------

        We store the cars already shown in the browser.

        This means refreshing the website won't immediately
        give you the same car.

        Once every car has been shown, a new cycle begins.
    */

    function showFeaturedCar() {

        if (cars.length === 0) return;


        let seenCars = JSON.parse(
            localStorage.getItem("shadshotSeenCars") || "[]"
        );


        // If every car has been seen, start again.
        if (seenCars.length >= cars.length) {

            seenCars = [];

        }


        // Find cars that haven't been shown yet.
        const availableCars = cars.filter((car, index) =>
            !seenCars.includes(index)
        );


        // Pick a random unseen car.
        const randomPosition =
            Math.floor(Math.random() * availableCars.length);

        const selectedCar =
            availableCars[randomPosition];


        const selectedIndex =
            cars.indexOf(selectedCar);


        // Remember this car.
        seenCars.push(selectedIndex);

        localStorage.setItem(
            "shadshotSeenCars",
            JSON.stringify(seenCars)
        );


        document.getElementById("featuredCard").innerHTML = `

            <h2>${escapeHTML(selectedCar.name)}</h2>

            <div class="details">

                ${selectedCar.manufacturer
                    ? `<div class="tag">
                        Manufacturer: ${escapeHTML(selectedCar.manufacturer)}
                       </div>`
                    : ""
                }

                ${selectedCar.carBrand
                    ? `<div class="tag">
                        Brand: ${escapeHTML(selectedCar.carBrand)}
                       </div>`
                    : ""
                }

                ${selectedCar.color
                    ? `<div class="tag">
                        Color: ${escapeHTML(selectedCar.color)}
                       </div>`
                    : ""
                }

            </div>

            <button class="new-car-btn" onclick="showFeaturedCar()">
                Show Another Car
            </button>

        `;

    }


    /*
        ----------------------------------------------------
        FILTERS
        ----------------------------------------------------
    */

    function setupFilters() {

        const manufacturers =
            [...new Set(
                cars
                    .map(car => car.manufacturer)
                    .filter(Boolean)
            )]
            .sort();


        const brands =
            [...new Set(
                cars
                    .map(car => car.carBrand)
                    .filter(Boolean)
            )]
            .sort();


        const colors =
            [...new Set(
                cars
                    .map(car => car.color)
                    .filter(Boolean)
            )]
            .sort();


        fillSelect(
            "manufacturerFilter",
            manufacturers
        );

        fillSelect(
            "brandFilter",
            brands
        );

        fillSelect(
            "colorFilter",
            colors
        );


        document.getElementById("search")
            .addEventListener("input", applyFilters);

        document.getElementById("manufacturerFilter")
            .addEventListener("change", applyFilters);

        document.getElementById("brandFilter")
            .addEventListener("change", applyFilters);

        document.getElementById("colorFilter")
            .addEventListener("change", applyFilters);

    }


    function fillSelect(id, values) {

        const select = document.getElementById(id);

        values.forEach(value => {

            const option =
                document.createElement("option");

            option.value = value;
            option.textContent = value;

            select.appendChild(option);

        });

    }


    /*
        ----------------------------------------------------
        SEARCH + FILTER
        ----------------------------------------------------
    */

    function applyFilters() {

        const search =
            document.getElementById("search")
                .value
                .toLowerCase()
                .trim();


        const manufacturer =
            document.getElementById("manufacturerFilter")
                .value;


        const brand =
            document.getElementById("brandFilter")
                .value;


        const color =
            document.getElementById("colorFilter")
                .value;


        displayedCars = cars.filter(car => {

            const matchesSearch =
                !search ||
                car.name.toLowerCase().includes(search) ||
                car.manufacturer.toLowerCase().includes(search) ||
                car.carBrand.toLowerCase().includes(search);


            const matchesManufacturer =
                !manufacturer ||
                car.manufacturer === manufacturer;


            const matchesBrand =
                !brand ||
                car.carBrand === brand;


            const matchesColor =
                !color ||
                car.color === color;


            return (
                matchesSearch &&
                matchesManufacturer &&
                matchesBrand &&
                matchesColor
            );

        });


        renderCars();

    }


    /*
        ----------------------------------------------------
        DISPLAY COLLECTION
        ----------------------------------------------------
    */

    function renderCars() {

        const grid =
            document.getElementById("carGrid");


        document.getElementById("collectionCount")
            .textContent =
            `${displayedCars.length} cars`;


        if (displayedCars.length === 0) {

            grid.innerHTML = `
                <div class="no-results">
                    No cars found.
                </div>
            `;

            return;
        }


        grid.innerHTML = displayedCars.map(car => `

            <div class="car-card">

                <h3>
                    ${escapeHTML(car.name)}
                </h3>

                <div class="car-info">

                    ${car.manufacturer
                        ? `<span>
                            <strong>Manufacturer:</strong>
                            ${escapeHTML(car.manufacturer)}
                           </span>`
                        : ""
                    }

                    ${car.carBrand
                        ? `<span>
                            <strong>Brand:</strong>
                            ${escapeHTML(car.carBrand)}
                           </span>`
                        : ""
                    }

                    ${car.color
                        ? `<span>
                            <strong>Color:</strong>
                            ${escapeHTML(car.color)}
                           </span>`
                        : ""
                    }

                </div>

            </div>

        `).join("");

    }


    /*
        ----------------------------------------------------
        SECURITY
        ----------------------------------------------------
    */

    function escapeHTML(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /*
        ----------------------------------------------------
        START WEBSITE
        ----------------------------------------------------
    */

    loadCSV();

</script>

</body>
</html>
