<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHADSHOT — My Die-Cast Cars Collection</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at 50% 35%, #292929 0%, #111 45%, #050505 100%);
    color: white;
    min-height: 100vh;
}

/* =========================
   HEADER
========================= */

header {
    height: 90px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 5%;
    border-bottom: 1px solid #333;
    background: rgba(5,5,5,0.85);
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 14px;
}

.logo {
    width: 50px;
    height: 50px;
    border: 3px solid #ff3b22;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ff3b22;
    font-size: 25px;
    font-weight: bold;
    box-shadow: 0 0 15px rgba(255,59,34,0.4);
}

.logo-text h1 {
    font-size: 21px;
    letter-spacing: 3px;
}

.logo-text p {
    color: #ff4b35;
    font-size: 12px;
    letter-spacing: 1px;
    margin-top: 4px;
}

.header-icons {
    display: flex;
    gap: 18px;
    font-size: 25px;
    color: #ddd;
}

/* =========================
   STATS
========================= */

.stats {
    width: 90%;
    max-width: 1400px;
    margin: 30px auto 20px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
}

.stat {
    border: 1px solid #555;
    border-radius: 18px;
    min-height: 105px;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 20px;
    background: rgba(20,20,20,0.7);
}

.stat-icon {
    width: 50px;
    height: 50px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    background: #292929;
}

.stat-number {
    font-size: 30px;
    font-weight: bold;
}

.stat-label {
    color: #ccc;
    font-size: 12px;
    margin-top: 4px;
    letter-spacing: 1px;
}

/* =========================
   COLLECTION DISPLAY
========================= */

.collection-panel {
    width: 90%;
    max-width: 1400px;
    margin: 25px auto;
    min-height: 650px;
    border: 1px solid #444;
    border-radius: 25px;
    position: relative;
    overflow: hidden;
    background:
        radial-gradient(
            ellipse at center bottom,
            rgba(255,60,35,0.18),
            transparent 45%
        ),
        linear-gradient(#191919, #0b0b0b);
}

/* glowing line */

.glow-line {
    position: absolute;
    top: 60px;
    left: 8%;
    width: 84%;
    height: 2px;
    background: #ff3b22;
    box-shadow:
        0 0 10px #ff3b22,
        0 0 25px rgba(255,59,34,0.7);
}

/* =========================
   SHELVES
========================= */

.shelves {
    position: relative;
    padding: 90px 35px 0;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 14px;
    height: 370px;
}

.shelf {
    height: 275px;
    border: 1px solid #444;
    border-radius: 14px;
    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,0.02),
            rgba(255,255,255,0.06),
            rgba(255,255,255,0.02)
        );
    display: grid;
    grid-template-rows: repeat(4, 1fr);
    overflow: hidden;
}

.shelf-car {
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid #222;
    font-size: 30px;
    cursor: pointer;
    transition: 0.2s;
}

.shelf-car:hover {
    background: rgba(255,59,34,0.12);
    transform: scale(1.04);
}

/* =========================
   PLATFORM
========================= */

.platform-area {
    position: absolute;
    bottom: 190px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    height: 190px;
}

.platform {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 75%;
    height: 40px;
    border-radius: 50%;
    border: 3px solid #ff3b22;
    box-shadow:
        0 0 10px #ff3b22,
        0 0 30px rgba(255,59,34,0.5);
    background: #151515;
}

.platform::before {
    content: "";
    position: absolute;
    left: 8%;
    right: 8%;
    top: 8px;
    height: 3px;
    background: #ff3b22;
    box-shadow: 0 0 12px #ff3b22;
}

.featured-car {
    position: absolute;
    left: 50%;
    bottom: 45px;
    transform: translateX(-50%);
    font-size: 80px;
    filter:
        drop-shadow(0 0 8px #ff3b22)
        drop-shadow(0 0 20px rgba(255,59,34,0.5));
    transition: 0.3s;
}

/* =========================
   ARROWS
========================= */

.arrow {
    position: absolute;
    bottom: 0;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: 1px solid #ff3b22;
    background: rgba(30,10,8,0.8);
    color: #ff3b22;
    font-size: 30px;
    cursor: pointer;
    z-index: 5;
}

.arrow:hover {
    background: #ff3b22;
    color: white;
    box-shadow: 0 0 20px #ff3b22;
}

.arrow.left {
    left: 5%;
}

.arrow.right {
    right: 5%;
}

/* =========================
   CAR INFO
========================= */

.car-info {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 70%;
    max-width: 850px;
    border: 1px solid #555;
    border-radius: 15px;
    padding: 18px 25px;
    background: rgba(10,10,10,0.95);
    box-shadow: 0 10px 35px rgba(0,0,0,0.7);
    z-index: 4;
}

.car-title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.car-title {
    font-size: 22px;
    font-weight: bold;
}

.car-number {
    color: #ff4b35;
    font-weight: bold;
}

.car-details {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.car-details div {
    color: #aaa;
    font-size: 11px;
}

.car-details strong {
    display: block;
    color: white;
    font-size: 14px;
    margin-top: 5px;
}

/* =========================
   EXPLORE
========================= */

.explore {
    width: 90%;
    max-width: 1400px;
    margin: 25px auto;
}

.explore h2 {
    font-size: 16px;
    margin-bottom: 10px;
}

.explore-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 12px;
    border-bottom: 1px solid #333;
    color: white;
    cursor: pointer;
}

.explore-item:hover {
    color: #ff4b35;
}

/* =========================
   FOOTER
========================= */

footer {
    text-align: center;
    padding: 50px 20px;
    color: #777;
}

footer strong {
    color: #ff4b35;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 800px) {

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .shelves {
        grid-template-columns: repeat(4, 1fr);
        padding-left: 15px;
        padding-right: 15px;
    }

    .shelf:nth-child(n+5) {
        display: none;
    }

    .car-info {
        width: 90%;
    }

    .car-details {
        grid-template-columns: repeat(3, 1fr);
    }

    .featured-car {
        font-size: 65px;
    }
}

@media (max-width: 500px) {

    header {
        padding: 0 20px;
    }

    .stats {
        width: 94%;
        gap: 8px;
    }

    .stat {
        padding: 12px;
        min-height: 85px;
    }

    .stat-number {
        font-size: 23px;
    }

    .stat-icon {
        width: 40px;
        height: 40px;
        font-size: 20px;
    }

    .collection-panel {
        width: 94%;
    }

    .shelves {
        height: 330px;
    }

    .car-title {
        font-size: 17px;
    }

    .car-details strong {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

    <div class="logo-area">

        <div class="logo">S</div>

        <div class="logo-text">
            <h1>SHADSHOT</h1>
            <p>MY DIE-CAST CARS COLLECTION</p>
        </div>

    </div>

    <div class="header-icons">
        <span>⌕</span>
        <span>☾</span>
    </div>

</header>


<!-- =========================
     STATS
========================= -->

<section class="stats">

    <div class="stat">
        <div class="stat-icon">🚗</div>
        <div>
            <div class="stat-number" id="totalCars">—</div>
            <div class="stat-label">TOTAL CARS</div>
        </div>
    </div>

    <div class="stat">
        <div class="stat-icon">🏁</div>
        <div>
            <div class="stat-number" id="totalBrands">—</div>
            <div class="stat-label">BRANDS</div>
        </div>
    </div>

    <div class="stat">
        <div class="stat-icon">🎨</div>
        <div>
            <div class="stat-number" id="totalColors">—</div>
            <div class="stat-label">COLORS</div>
        </div>
    </div>

    <div class="stat">
        <div class="stat-icon">🏎️</div>
        <div>
            <div class="stat-number" id="uniqueModels">—</div>
            <div class="stat-label">UNIQUE MODELS</div>
        </div>
    </div>

</section>


<!-- =========================
     MAIN COLLECTION
========================= -->

<section class="collection-panel">

    <div class="glow-line"></div>

    <!-- Background shelves -->

    <div class="shelves" id="shelves"></div>


    <!-- Featured car -->

    <div class="platform-area">

        <div class="featured-car" id="featuredCar">
            🚗
        </div>

        <div class="platform"></div>

        <button class="arrow left" onclick="previousCar()">
            ‹
        </button>

        <button class="arrow right" onclick="nextCar()">
            ›
        </button>

    </div>


    <!-- Car information -->

    <div class="car-info">

        <div class="car-title-row">

            <div class="car-title" id="carName">
                Loading collection...
            </div>

            <div class="car-number" id="carNumber">
                —
            </div>

        </div>

        <div class="car-details">

            <div>
                BRAND
                <strong id="carBrand">—</strong>
            </div>

            <div>
                COLOR
                <strong id="carColor">—</strong>
            </div>

            <div>
                MODEL
                <strong id="carModel">—</strong>
            </div>

        </div>

    </div>

</section>


<!-- =========================
     EXPLORE
========================= -->

<section class="explore">

    <h2>EXPLORE COLLECTION</h2>

    <div class="explore-item" onclick="sortByBrand()">
        <span>🏁 &nbsp; By Brand</span>
        <span>›</span>
    </div>

    <div class="explore-item" onclick="sortByColor()">
        <span>🎨 &nbsp; By Color</span>
        <span>›</span>
    </div>

    <div class="explore-item" onclick="sortByName()">
        <span>🚗 &nbsp; By Car Name</span>
        <span>›</span>
    </div>

</section>


<!-- =========================
     FOOTER
========================= -->

<footer>

    "It's not just a collection, it's a passion."

    <br><br>

    — <strong>SHADSHOT</strong>

</footer>


<script>

/* =========================================================
   COLLECTION DATA
   Loaded automatically from Collection.csv
========================================================= */

let cars = [];
let currentIndex = 0;


/* =========================================================
   CSV PARSER
   Handles commas inside quoted fields too
========================================================= */

function parseCSV(text) {

    const rows = [];
    let row = [];
    let value = "";
    let insideQuotes = false;

    for (let i = 0; i < text.length; i++) {

        const char = text[i];
        const next = text[i + 1];

        if (char === '"' && insideQuotes && next === '"') {

            value += '"';
            i++;

        } else if (char === '"') {

            insideQuotes = !insideQuotes;

        } else if (char === ',' && !insideQuotes) {

            row.push(value.trim());
            value = "";

        } else if ((char === '\n' || char === '\r') && !insideQuotes) {

            if (value !== "" || row.length > 0) {

                row.push(value.trim());
                rows.push(row);

            }

            value = "";
            row = [];

            if (char === '\r' && next === '\n') {
                i++;
            }

        } else {

            value += char;

        }
    }

    if (value !== "" || row.length > 0) {

        row.push(value.trim());
        rows.push(row);

    }

    return rows;
}


/* =========================================================
   LOAD CSV
========================================================= */

async function loadCollection() {

    try {

        const response = await fetch("Collection.csv");

        if (!response.ok) {
            throw new Error("Could not load Collection.csv");
        }

        const text = await response.text();

        const rows = parseCSV(text);

        if (rows.length < 2) {
            throw new Error("CSV does not contain enough data.");
        }


        /* Header row */

        const headers = rows[0].map(header =>
            header.trim().toLowerCase()
        );


        /*
            Find the columns by their names.

            This means the order of the columns
            can change and the website can still
            find the correct information.
        */

        const carNameIndex =
            headers.findIndex(h =>
                h === "car name" ||
                h === "car" ||
                h === "name"
            );

        const brandIndex =
            headers.findIndex(h =>
                h === "manufacturer" ||
                h === "brand"
            );

        const colorIndex =
            headers.findIndex(h =>
                h === "color" ||
                h === "colour"
            );


        /* Convert CSV rows into car objects */

        cars = rows.slice(1)
            .filter(row => row.length > 0 && row[carNameIndex])
            .map(row => {

                return {

                    name: row[carNameIndex] || "Unknown Car",

                    brand: row[brandIndex] || "Unknown",

                    color: row[colorIndex] || "Unknown"

                };

            });


        /* Update statistics */

        updateStats();


        /* Display first car */

        showCar(0);


        /* Create background shelves */

        createShelves();


    } catch (error) {

        console.error(error);

        document.getElementById("carName").textContent =
            "Unable to load collection";

        document.getElementById("carBrand").textContent =
            "Check Collection.csv";

    }

}


/* =========================================================
   STATISTICS
========================================================= */

function updateStats() {

    const brands = new Set(
        cars.map(car => car.brand.toUpperCase())
    );

    const colors = new Set(
        cars.map(car => car.color.toUpperCase())
    );

    const models = new Set(
        cars.map(car => car.name.toUpperCase())
    );


    document.getElementById("totalCars").textContent =
        cars.length;

    document.getElementById("totalBrands").textContent =
        brands.size;

    document.getElementById("totalColors").textContent =
        colors.size;

    document.getElementById("uniqueModels").textContent =
        models.size;

}


/* =========================================================
   SHOW SELECTED CAR
========================================================= */

function showCar(index) {

    if (cars.length === 0) return;

    currentIndex =
        (index + cars.length) % cars.length;

    const car = cars[currentIndex];


    document.getElementById("carName").textContent =
        car.name;

    document.getElementById("carBrand").textContent =
        car.brand;

    document.getElementById("carColor").textContent =
        car.color;

    document.getElementById("carModel").textContent =
        car.name;

    document.getElementById("carNumber").textContent =
        `${currentIndex + 1} / ${cars.length}`;


    /*
        Use a different emoji depending
        on the car color.
    */

    document.getElementById("featuredCar").textContent =
        getCarEmoji(car.color);


    highlightShelfCar();

}


/* =========================================================
   CAR EMOJI
========================================================= */

function getCarEmoji(color) {

    const c = color.toLowerCase();

    if (c.includes("red")) return "🏎️";

    if (c.includes("blue")) return "🚙";

    if (c.includes("green")) return "🚗";

    if (c.includes("black")) return "🏎️";

    if (c.includes("white")) return "🚘";

    if (c.includes("orange")) return "🏎️";

    if (c.includes("yellow")) return "🚕";

    if (c.includes("purple")) return "🚗";

    return "🚗";

}


/* =========================================================
   NEXT / PREVIOUS
========================================================= */

function nextCar() {

    showCar(currentIndex + 1);

}

function previousCar() {

    showCar(currentIndex - 1);

}


/* =========================================================
   BACKGROUND SHELVES
========================================================= */

function createShelves() {

    const shelvesContainer =
        document.getElementById("shelves");

    shelvesContainer.innerHTML = "";


    /*
        We display a small rotating selection
        of cars in the background.

        The full collection still exists in
        the CSV and can be browsed with arrows.
    */

    const visibleCars = 28;

    for (let shelfNumber = 0; shelfNumber < 7; shelfNumber++) {

        const shelf = document.createElement("div");

        shelf.className = "shelf";


        for (let position = 0; position < 4; position++) {

            const index =
                (shelfNumber * 4 + position) % cars.length;

            const car = cars[index];

            const carElement =
                document.createElement("div");

            carElement.className = "shelf-car";

            carElement.textContent =
                getCarEmoji(car.color);

            carElement.title =
                car.name;


            carElement.onclick = function() {

                showCar(index);

            };


            shelf.appendChild(carElement);

        }


        shelvesContainer.appendChild(shelf);

    }

}


/* =========================================================
   HIGHLIGHT CURRENT SHELF CAR
========================================================= */

function highlightShelfCar() {

    const shelfCars =
        document.querySelectorAll(".shelf-car");

    shelfCars.forEach((element, index) => {

        element.style.opacity =
            index === currentIndex % 28
                ? "1"
                : "0.65";

    });

}


/* =========================================================
   SORTING
========================================================= */

function sortByBrand() {

    cars.sort((a, b) =>
        a.brand.localeCompare(b.brand)
    );

    currentIndex = 0;

    createShelves();

    showCar(0);

}


function sortByColor() {

    cars.sort((a, b) =>
        a.color.localeCompare(b.color)
    );

    currentIndex = 0;

    createShelves();

    showCar(0);

}


function sortByName() {

    cars.sort((a, b) =>
        a.name.localeCompare(b.name)
    );

    currentIndex = 0;

    createShelves();

    showCar(0);

}


/* =========================================================
   START WEBSITE
========================================================= */

loadCollection();

</script>

</body>
</html>
