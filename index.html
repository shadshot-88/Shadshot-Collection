<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Shadshot Collection</title>

<style>

/* =====================================================
   ROOT
===================================================== */

:root {

    --bg: #050506;

    --red: #ff2418;
    --red-dark: #7b0804;

    --gold: #ffc14a;
    --gold-dark: #8b5d13;

    --text: #f7f3e9;
    --muted: #aaa39a;

}


/* =====================================================
   GENERAL
===================================================== */

* {

    box-sizing: border-box;

    margin: 0;

    padding: 0;

}


html {

    scroll-behavior: smooth;

}


body {

    min-height: 100vh;

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:

        radial-gradient(
            ellipse at 50% 20%,
            rgba(150, 15, 8, 0.25),
            transparent 42%
        ),

        radial-gradient(
            ellipse at 50% 75%,
            rgba(255, 36, 24, 0.07),
            transparent 40%
        ),

        #050506;

    overflow-x: hidden;

}


button,
input,
select {

    font: inherit;

}


.container {

    width:
        min(
            1400px,
            calc(100% - 42px)
        );

    margin: auto;

}


/* =====================================================
   HEADER
===================================================== */

header {

    text-align: center;

    padding:
        28px
        20px
        8px;

    position: relative;

    z-index: 20;

}


.arc-reactor {

    width: 52px;
    height: 52px;

    margin:
        0
        auto
        14px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            white 0 9%,
            #65dfff 10% 22%,
            #009bd0 23% 35%,
            #111 36% 52%,
            transparent 53%
        );

    box-shadow:

        0 0 12px #3bdfff,

        0 0 28px
        rgba(0, 180, 255, 0.65);

    border:
        1px solid
        rgba(255,255,255,0.3);

}


.logo-small {

    color: var(--gold);

    font-size: 13px;

    font-weight: 700;

    letter-spacing: 8px;

    margin-bottom: 4px;

}


header h1 {

    font-size:
        clamp(
            42px,
            7vw,
            82px
        );

    line-height: 0.95;

    font-weight: 900;

    letter-spacing: 2px;

    color: #f7f7f7;

    text-shadow:

        0 0 8px
        rgba(255,255,255,0.35),

        0 0 25px
        rgba(255,40,25,0.28);

}


header h1 span {

    color: #d71912;

    text-shadow:

        0 0 10px
        rgba(255,35,20,0.7),

        0 0 30px
        rgba(255,35,20,0.3);

}


.subtitle {

    margin-top: 14px;

    color: #b9b2a9;

    font-size: 14px;

    letter-spacing: 5px;

    text-transform: uppercase;

}


/* =====================================================
   HERO
===================================================== */

.hero {

    position: relative;

    min-height: 650px;

    margin-top: 5px;

    overflow: hidden;

}


/* glowing line */

.hero::before {

    content: "";

    position: absolute;

    left: 12%;
    right: 12%;

    top: 78px;

    height: 1px;

    background:

        linear-gradient(
            90deg,
            transparent,
            var(--red),
            var(--gold),
            var(--red),
            transparent
        );

    box-shadow:
        0 0 15px
        rgba(255,30,20,0.7);

    z-index: 5;

}


/* =====================================================
   BACKGROUND CAR STASH
===================================================== */

.car-stash {

    position: absolute;

    inset:
        65px
        0
        45px;

    display: flex;

    justify-content:
        space-between;

    pointer-events: none;

    z-index: 1;

}


.shelf-column {

    width: 31%;

    display: flex;

    flex-direction: column;

    justify-content:
        space-around;

    gap: 12px;

}


.shelf-column.left {

    align-items: flex-start;

}


.shelf-column.right {

    align-items: flex-end;

}


/* individual shelf */

.shelf {

    width: 100%;

    height: 115px;

    position: relative;

    border-bottom:
        2px solid
        rgba(132,82,28,0.55);

    background:

        linear-gradient(
            180deg,
            rgba(255,155,45,0.025),
            rgba(0,0,0,0.4)
        );

    box-shadow:

        0 12px 20px
        rgba(0,0,0,0.5),

        inset 0 -5px 20px
        rgba(0,0,0,0.4);

}


/* actual background car */

.stash-car {

    position: absolute;

    width: 145px;

    height: 95px;

    object-fit: contain;

    object-position: center;

    bottom: 5px;

    opacity: 0.32;

    filter:
        blur(1px)
        brightness(0.65)
        drop-shadow(
            0 10px 8px
            rgba(0,0,0,0.7)
        );

    transition:
        opacity 0.3s ease;

}


.shelf:nth-child(even) .stash-car {

    transform: scaleX(-1);

}


/* =====================================================
   CENTRAL STAGE
===================================================== */

.stage {

    position: absolute;

    left: 50%;

    top: 95px;

    transform:
        translateX(-50%);

    width:
        min(
            900px,
            72vw
        );

    height: 460px;

    display: flex;

    flex-direction: column;

    justify-content: flex-end;

    align-items: center;

    z-index: 8;

}


/* glowing floor */

.stage-floor {

    position: absolute;

    width: 100%;

    height: 230px;

    bottom: 0;

    border-radius: 50%;

    background:

        radial-gradient(
            ellipse,
            rgba(255,34,22,0.30),
            rgba(100,5,0,0.16) 42%,
            transparent 70%
        );

    box-shadow:

        0 -2px 25px
        rgba(255,36,24,0.18);

}


/* stage ring */

.stage-ring {

    position: absolute;

    width: 570px;

    height: 155px;

    bottom: 50px;

    border-radius: 50%;

    border:
        2px solid
        rgba(255,46,31,0.7);

    box-shadow:

        0 0 10px
        rgba(255,38,22,0.8),

        0 0 45px
        rgba(255,38,22,0.25),

        inset 0 0 25px
        rgba(255,38,22,0.15);

    transform:
        perspective(250px)
        rotateX(58deg);

}


/* =====================================================
   FEATURED CAR
===================================================== */

.featured-car {

    position: relative;

    width:
        min(
            760px,
            78vw
        );

    height: 330px;

    display: flex;

    align-items: center;

    justify-content: center;

    z-index: 10;

    animation:
        carAppear 0.4s ease;

}


/* ACTUAL CAR IMAGE */

.featured-image {

    width:
        min(
            700px,
            78vw
        );

    height: 330px;

    object-fit: contain;

    object-position: center;

    position: relative;

    z-index: 11;

    filter:

        drop-shadow(
            0 30px 22px
            rgba(0,0,0,0.85)
        )

        drop-shadow(
            0 0 25px
            rgba(255,40,25,0.20)
        );

    animation:
        carImageAppear 0.4s ease;

}


/* =====================================================
   FEATURED INFO
===================================================== */

.featured-info {

    position: absolute;

    left: 50%;

    bottom: -8px;

    transform:
        translateX(-50%);

    width:
        min(
            850px,
            90vw
        );

    text-align: center;

    z-index: 15;

}


.featured-name {

    font-size:
        clamp(
            25px,
            4vw,
            45px
        );

    font-weight: 800;

    letter-spacing: 4px;

    text-transform: uppercase;

    text-shadow:

        0 0 12px
        rgba(255,255,255,0.3),

        0 0 25px
        rgba(255,40,25,0.2);

}


.featured-meta {

    margin-top: 14px;

    display: flex;

    justify-content: center;

    gap: 10px;

    flex-wrap: wrap;

}


.meta-box {

    min-width: 150px;

    padding:
        10px
        18px;

    border-radius: 10px;

    background:

        linear-gradient(
            180deg,
            rgba(55,12,9,0.86),
            rgba(25,7,5,0.96)
        );

    border:
        1px solid
        rgba(255,50,30,0.25);

    box-shadow:
        inset 0 0 18px
        rgba(255,30,20,0.04);

}


.meta-label {

    display: block;

    color: var(--gold);

    font-size: 10px;

    letter-spacing: 2px;

    text-transform: uppercase;

    margin-bottom: 4px;

}


.meta-value {

    font-size: 14px;

    font-weight: 700;

}


/* =====================================================
   NAVIGATION ARROWS
===================================================== */

.nav-arrow {

    position: absolute;

    top: 47%;

    transform:
        translateY(-50%);

    width: 76px;

    height: 76px;

    border-radius: 50%;

    border:
        2px solid
        rgba(255,50,35,0.9);

    background:

        radial-gradient(
            circle,
            rgba(255,45,25,0.16),
            rgba(0,0,0,0.65)
        );

    color: var(--gold);

    font-size: 56px;

    line-height: 60px;

    cursor: pointer;

    z-index: 20;

    transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        background 0.18s ease;

    box-shadow:

        0 0 15px
        rgba(255,36,24,0.4),

        inset 0 0 18px
        rgba(255,36,24,0.08);

}


.nav-arrow:hover {

    transform:
        translateY(-50%)
        scale(1.10);

    background:

        radial-gradient(
            circle,
            rgba(255,45,25,0.32),
            rgba(0,0,0,0.5)
        );

    box-shadow:

        0 0 28px
        rgba(255,36,24,0.75);

}


.nav-left {

    left: 15px;

}


.nav-right {

    right: 15px;

}


.arrow {

    position: relative;

    top: -4px;

}


/* =====================================================
   COLLECTION SECTION
===================================================== */

.collection {

    position: relative;

    margin-top: 20px;

    padding-bottom: 40px;

    z-index: 10;

}


.collection-title {

    display: flex;

    align-items: center;

    justify-content: space-between;

    border-bottom:
        1px solid
        rgba(255,35,22,0.45);

    padding-bottom: 10px;

    margin-bottom: 18px;

}


.collection-title h2 {

    font-size: 24px;

    letter-spacing: 2px;

    text-transform: uppercase;

}


.collection-title h2::before {

    content: "◈";

    color: var(--gold);

    margin-right: 10px;

    font-size: 18px;

}


.collection-count {

    color: #ddd;

    font-size: 14px;

}


.collection-count strong {

    color: var(--red);

    font-size: 20px;

}


/* =====================================================
   FILTERS
===================================================== */

.controls {

    display: grid;

    grid-template-columns:
        2fr
        1fr
        1fr
        1fr;

    gap: 10px;

    margin-bottom: 20px;

}


input,
select {

    width: 100%;

    padding:
        13px
        15px;

    color: white;

    background:

        linear-gradient(
            180deg,
            rgba(22,16,16,0.95),
            rgba(11,10,11,0.95)
        );

    border:
        1px solid
        rgba(255,48,30,0.28);

    border-radius: 8px;

    outline: none;

}


input::placeholder {

    color: #8f8983;

}


input:focus,
select:focus {

    border-color:
        rgba(255,183,65,0.65);

    box-shadow:
        0 0 15px
        rgba(255,50,30,0.12);

}


/* =====================================================
   CAR GRID
===================================================== */

.car-grid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(215px,1fr)
        );

    gap: 14px;

}


.car-card {

    min-height: 165px;

    padding: 17px;

    border-radius: 10px;

    background:

        linear-gradient(
            145deg,
            rgba(25,19,18,0.96),
            rgba(9,9,10,0.98)
        );

    border:
        1px solid
        rgba(255,42,27,0.22);

    box-shadow:
        inset 0 0 20px
        rgba(255,30,20,0.025);

    transition:

        transform 0.2s ease,

        border-color 0.2s ease,

        box-shadow 0.2s ease;

}


.car-card:hover {

    transform:
        translateY(-4px);

    border-color:
        rgba(255,180,60,0.55);

    box-shadow:

        0 10px 25px
        rgba(0,0,0,0.5),

        0 0 20px
        rgba(255,30,20,0.08);

}


.car-card h3 {

    font-size: 16px;

    line-height: 1.25;

    margin-bottom: 14px;

    text-transform: uppercase;

}


.car-info {

    display: flex;

    flex-direction: column;

    gap: 7px;

    color: #bdb7b0;

    font-size: 12px;

}


.car-info strong {

    color: #e9e5de;

}


.color-dot {

    display: inline-block;

    width: 8px;
    height: 8px;

    border-radius: 50%;

    margin-right: 5px;

    background: var(--red);

}


/* =====================================================
   LOADING / ERROR
===================================================== */

.loading,
.error,
.no-results {

    text-align: center;

    padding: 50px 20px;

    color: var(--muted);

}


/* =====================================================
   ANIMATIONS
===================================================== */

@keyframes carAppear {

    from {

        opacity: 0;

        transform:
            translateY(15px)
            scale(0.97);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


@keyframes carImageAppear {

    from {

        opacity: 0;

        transform:
            translateY(18px)
            scale(0.94);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 900px) {

    .hero {

        min-height: 620px;

    }


    .stage {

        width: 82vw;

    }


    .car-stash {

        opacity: 0.65;

    }


    .stash-car {

        width: 110px;

        height: 80px;

    }


    .controls {

        grid-template-columns:
            1fr 1fr;

    }


    .nav-arrow {

        width: 62px;

        height: 62px;

        font-size: 45px;

    }

}


@media (max-width: 600px) {

    .container {

        width:
            calc(100% - 20px);

    }


    header h1 {

        font-size: 42px;

    }


    .subtitle {

        letter-spacing: 2px;

    }


    .hero {

        min-height: 575px;

    }


    .car-stash {

        opacity: 0.35;

    }


    .shelf {

        height: 100px;

    }


    .stash-car {

        width: 90px;

        height: 70px;

    }


    .stage {

        width: 94vw;

        top: 105px;

    }


    .featured-car {

        width: 92vw;

        height: 310px;

    }


    .featured-image {

        width: 90vw;

        height: 300px;

    }


    .stage-ring {

        width: 360px;

        height: 110px;

    }


    .featured-info {

        bottom: -3px;

    }


    .featured-name {

        letter-spacing: 2px;

        font-size: 23px;

    }


    .meta-box {

        min-width: 115px;

        padding:
            8px
            10px;

    }


    .controls {

        grid-template-columns:
            1fr;

    }


    .car-grid {

        grid-template-columns:
            1fr 1fr;

    }


    .nav-arrow {

        width: 55px;

        height: 55px;

        font-size: 40px;

        top: 42%;

    }


    .nav-left {

        left: 2px;

    }


    .nav-right {

        right: 2px;

    }

}


@media (max-width: 420px) {

    .car-grid {

        grid-template-columns:
            1fr;

    }


    .nav-arrow {

        width: 48px;

        height: 48px;

        font-size: 34px;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- =================================================
     HEADER
================================================= -->

<header>

    <div class="arc-reactor"></div>

    <div class="logo-small">
        SHADSHOT
    </div>

    <h1>
        <span>COLLECTION</span>
    </h1>

    <div class="subtitle">
        MY DIE-CAST CAR COLLECTION
    </div>

</header>


<!-- =================================================
     HERO
================================================= -->

<section class="hero">


    <!-- ================================================
         BACKGROUND STASH
    ================================================= -->

    <div
        class="car-stash"
        id="carStash"
    >

        <div class="shelf-column left">

            <div class="shelf">
                <img
                    class="stash-car"
                    id="stash1"
                    alt=""
                >
            </div>

            <div class="shelf">
                <img
                    class="stash-car"
                    id="stash2"
                    alt=""
                >
            </div>

            <div class="shelf">
                <img
                    class="stash-car"
                    id="stash3"
                    alt=""
                >
            </div>

            <div class="shelf">
                <img
                    class="stash-car"
                    id="stash4"
                    alt=""
                >
            </div>

        </div>


        <div class="shelf-column right">

            <div class="shelf">
                <img
                    class="stash-car"
                    id="stash5"
                    alt=""
                >
            </div>

            <div class="shelf">
                <img
                    class="stash-car"
                    id="stash6"
                    alt=""
                >
            </div>

            <div class="shelf">
                <img
                    class="stash-car"
                    id="stash7"
                    alt=""
                >
            </div>

            <div class="shelf">
                <img
                    class="stash-car"
                    id="stash8"
                    alt=""
                >
            </div>

        </div>

    </div>


    <!-- ================================================
         LEFT ARROW
    ================================================= -->

    <button
        class="nav-arrow nav-left"
        id="previousCar"
        aria-label="Previous car"
    >

        <span class="arrow">
            ‹
        </span>

    </button>


    <!-- ================================================
         RIGHT ARROW
    ================================================= -->

    <button
        class="nav-arrow nav-right"
        id="nextCar"
        aria-label="Next car"
    >

        <span class="arrow">
            ›
        </span>

    </button>


    <!-- ================================================
         CENTRAL STAGE
    ================================================= -->

    <div class="stage">


        <div class="stage-floor"></div>

        <div class="stage-ring"></div>


        <div
            class="featured-car"
            id="featuredCar"
        >

            <div class="loading">
                Loading...
            </div>

        </div>


        <div class="featured-info">


            <div
                class="featured-name"
                id="featuredName"
            >
                Loading...
            </div>


            <div
                class="featured-meta"
                id="featuredMeta"
            ></div>


        </div>


    </div>

</section>


<!-- =================================================
     COLLECTION
================================================= -->

<section class="collection">


    <div class="collection-title">

        <h2>
            My Collection
        </h2>


        <div class="collection-count">

            <strong
                id="collectionCount"
            >
                0
            </strong>

            CARS

        </div>

    </div>


    <div class="controls">


        <input
            id="search"
            type="text"
            placeholder="Search cars..."
        >


        <select
            id="manufacturerFilter"
        >

            <option value="">
                All Manufacturers
            </option>

        </select>


        <select
            id="brandFilter"
        >

            <option value="">
                All Car Brands
            </option>

        </select>


        <select
            id="colorFilter"
        >

            <option value="">
                All Colors
            </option>

        </select>


    </div>


    <div
        class="car-grid"
        id="carGrid"
    >

        <div class="loading">
            Loading collection...
        </div>

    </div>


</section>


</div>


<script>


/* =====================================================
   VARIABLES
===================================================== */

let cars = [];

let displayedCars = [];

let currentCarIndex = 0;


/* =====================================================
   IMAGE EXTENSIONS
===================================================== */

const imageExtensions = [

    ".png",
    ".jpg",
    ".jpeg",
    ".webp"

];


/* =====================================================
   GET IMAGE PATH
===================================================== */

function getImageNumber(car) {

    return String(
        car.serialNumber
    )
        .trim()
        .padStart(3, "0");

}


/* =====================================================
   SET IMAGE WITH AUTOMATIC EXTENSION
===================================================== */

function setCarImage(
    imageElement,
    serialNumber
) {

    const number =
        String(serialNumber)
            .trim()
            .padStart(3, "0");


    let extensionIndex = 0;


    function tryNextImage() {

        if (
            extensionIndex >=
            imageExtensions.length
        ) {

            imageElement.style.display =
                "none";

            return;

        }


        imageElement.src =
            "images/" +
            number +
            imageExtensions[
                extensionIndex
            ];


        extensionIndex++;

    }


    imageElement.onerror =
        tryNextImage;


    tryNextImage();

}


/* =====================================================
   LOAD CSV
===================================================== */

async function loadCSV() {

    try {


        const response =
            await fetch(
                "Collection.csv",
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Collection.csv could not be loaded."
            );

        }


        const text =
            await response.text();


        cars =
            parseCSV(text);


        if (!cars.length) {

            throw new Error(
                "No cars found."
            );

        }


        displayedCars =
            [...cars];


        setupFilters();

        setupNavigation();


        /*
           RANDOM CAR EVERY TIME
           THE WEBSITE IS OPENED
        */

        chooseRandomCar();


        renderFeaturedCar();


        renderStash();


        renderCollection();


    }


    catch (error) {


        console.error(error);


        document.getElementById(
            "featuredName"
        ).textContent =
            "COLLECTION ERROR";


        document.getElementById(
            "carGrid"
        ).innerHTML = `

            <div class="error">

                Could not load
                <strong>Collection.csv</strong>.

                <br><br>

                Make sure the CSV is in
                the same folder as
                index.html.

            </div>

        `;

    }

}


/* =====================================================
   CSV PARSER
===================================================== */

function parseCSV(text) {


    const rows = [];

    let row = [];

    let value = "";

    let insideQuotes = false;


    for (
        let i = 0;
        i < text.length;
        i++
    ) {


        const char =
            text[i];


        const next =
            text[i + 1];


        if (
            char === '"' &&
            insideQuotes &&
            next === '"'
        ) {

            value += '"';

            i++;

        }


        else if (
            char === '"'
        ) {

            insideQuotes =
                !insideQuotes;

        }


        else if (
            char === "," &&
            !insideQuotes
        ) {

            row.push(
                value.trim()
            );

            value = "";

        }


        else if (
            (
                char === "\n" ||
                char === "\r"
            ) &&
            !insideQuotes
        ) {


            if (
                char === "\r" &&
                next === "\n"
            ) {

                i++;

            }


            row.push(
                value.trim()
            );

            value = "";


            if (
                row.some(
                    cell =>
                        cell !== ""
                )
            ) {

                rows.push(row);

            }


            row = [];

        }


        else {

            value += char;

        }

    }


    if (
        value !== "" ||
        row.length > 0
    ) {


        row.push(
            value.trim()
        );


        if (
            row.some(
                cell =>
                    cell !== ""
            )
        ) {

            rows.push(row);

        }

    }


    if (
        rows.length < 2
    ) {

        return [];

    }


    const headers =
        rows[0].map(
            header =>
                header
                    .replace(
                        /^\uFEFF/,
                        ""
                    )
                    .trim()
                    .toLowerCase()
        );


    return rows
        .slice(1)
        .map(
            (row, rowIndex) => {


                const data = {};


                headers.forEach(
                    (
                        header,
                        index
                    ) => {

                        data[header] =
                            row[index] ||
                            "";

                    }
                );


                /*
                   Serial number is used ONLY
                   to find the picture.

                   It is NEVER displayed.
                */

                const serial =
                    data["sr no"] ||
                    data["sr. no"] ||
                    data["sr. no."] ||
                    data["serial no"] ||
                    data["serial number"] ||
                    String(
                        rowIndex + 1
                    );


                return {

                    serialNumber:
                        serial,


                    name:
                        data["cars"] ||
                        data["car name"] ||
                        data["name"] ||
                        "",


                    manufacturer:
                        data["manufacturer"] ||
                        "",


                    color:
                        data["color"] ||
                        "",


                    carBrand:
                        data["car brand"] ||
                        ""

                };

            }
        )


        .filter(
            car =>
                car.name !== ""
        );

}


/* =====================================================
   RANDOM STARTING CAR
===================================================== */

function chooseRandomCar() {


    currentCarIndex =
        Math.floor(
            Math.random() *
            cars.length
        );

}


/* =====================================================
   NAVIGATION
===================================================== */

function nextCar() {


    if (!cars.length)
        return;


    currentCarIndex++;


    if (
        currentCarIndex >=
        cars.length
    ) {

        currentCarIndex = 0;

    }


    renderFeaturedCar();

    renderStash();

}


function previousCar() {


    if (!cars.length)
        return;


    currentCarIndex--;


    if (
        currentCarIndex < 0
    ) {

        currentCarIndex =
            cars.length - 1;

    }


    renderFeaturedCar();

    renderStash();

}


/* =====================================================
   SETUP NAVIGATION
===================================================== */

function setupNavigation() {


    document
        .getElementById(
            "nextCar"
        )
        .addEventListener(
            "click",
            nextCar
        );


    document
        .getElementById(
            "previousCar"
        )
        .addEventListener(
            "click",
            previousCar
        );

}


/* =====================================================
   KEYBOARD ARROWS
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {


        const tag =
            document.activeElement
                ?.tagName
                ?.toLowerCase();


        /*
           Don't change cars while
           typing in search/filter boxes.
        */

        if (
            tag === "input" ||
            tag === "select" ||
            tag === "textarea"
        ) {

            return;

        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            event.preventDefault();

            nextCar();

        }


        else if (
            event.key ===
            "ArrowLeft"
        ) {

            event.preventDefault();

            previousCar();

        }

    }
);


/* =====================================================
   FEATURED CAR
===================================================== */

function renderFeaturedCar() {


    const car =
        cars[currentCarIndex];


    if (!car)
        return;


    const featured =
        document.getElementById(
            "featuredCar"
        );


    featured.innerHTML = `

        <img
            class="featured-image"
            id="featuredImage"
            alt="${escapeHTML(
                car.name
            )}"
        >

    `;


    const image =
        document.getElementById(
            "featuredImage"
        );


    setCarImage(
        image,
        car.serialNumber
    );


    document.getElementById(
        "featuredName"
    ).textContent =
        car.name;


    document.getElementById(
        "featuredMeta"
    ).innerHTML = `


        ${createMeta(
            "MANUFACTURER",
            car.manufacturer
        )}


        ${createMeta(
            "BRAND",
            car.carBrand
        )}


        ${createMeta(
            "COLOR",
            car.color
        )}

    `;


    /*
       Restart animation
    */

    featured.style.animation =
        "none";


    void featured.offsetWidth;


    featured.style.animation =
        "carAppear 0.4s ease";

}


/* =====================================================
   META BOX
===================================================== */

function createMeta(
    label,
    value
) {


    if (!value)
        return "";


    return `

        <div class="meta-box">

            <span class="meta-label">

                ${label}

            </span>


            <span class="meta-value">

                ${escapeHTML(
                    value
                )}

            </span>

        </div>

    `;

}


/* =====================================================
   BACKGROUND STASH
===================================================== */

function renderStash() {


    if (!cars.length)
        return;


    /*
       These are the cars shown behind
       the featured car.

       We deliberately skip the currently
       selected car.
    */


    const availableCars =
        cars.filter(
            (
                car,
                index
            ) =>
                index !==
                currentCarIndex
        );


    /*
       Shuffle the available cars.
    */

    const shuffled =
        [...availableCars]
            .sort(
                () =>
                    Math.random() -
                    0.5
            );


    const stashCars =
        shuffled.slice(
            0,
            8
        );


    for (
        let i = 1;
        i <= 8;
        i++
    ) {


        const element =
            document.getElementById(
                "stash" + i
            );


        const car =
            stashCars[i - 1];


        if (
            !car ||
            !element
        ) {

            if (element) {

                element.style.display =
                    "none";

            }

            continue;

        }


        element.style.display =
            "block";


        setCarImage(
            element,
            car.serialNumber
        );

    }

}


/* =====================================================
   FILTERS
===================================================== */

function setupFilters() {


    const manufacturers =
        uniqueValues(
            cars.map(
                car =>
                    car.manufacturer
            )
        );


    const brands =
        uniqueValues(
            cars.map(
                car =>
                    car.carBrand
            )
        );


    const colors =
        uniqueValues(
            cars.map(
                car =>
                    car.color
            )
        );


    fillSelect(
        "manufacturerFilter",
        manufacturers
    );


    fillSelect(
        "brandFilter",
        brands
    );


    fillSelect(
        "colorFilter",
        colors
    );


    document
        .getElementById(
            "search"
        )
        .addEventListener(
            "input",
            applyFilters
        );


    document
        .getElementById(
            "manufacturerFilter"
        )
        .addEventListener(
            "change",
            applyFilters
        );


    document
        .getElementById(
            "brandFilter"
        )
        .addEventListener(
            "change",
            applyFilters
        );


    document
        .getElementById(
            "colorFilter"
        )
        .addEventListener(
            "change",
            applyFilters
        );

}


/* =====================================================
   UNIQUE VALUES
===================================================== */

function uniqueValues(
    values
) {


    return [

        ...new Set(

            values
                .filter(Boolean)

        )

    ].sort();

}


/* =====================================================
   FILL SELECT
===================================================== */

function fillSelect(
    id,
    values
) {


    const select =
        document.getElementById(
            id
        );


    values.forEach(
        value => {


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                value;


            option.textContent =
                value;


            select.appendChild(
                option
            );

        }
    );

}


/* =====================================================
   APPLY FILTERS
===================================================== */

function applyFilters() {


    const search =
        document.getElementById(
            "search"
        )
        .value
        .toLowerCase()
        .trim();


    const manufacturer =
        document.getElementById(
            "manufacturerFilter"
        ).value;


    const brand =
        document.getElementById(
            "brandFilter"
        ).value;


    const color =
        document.getElementById(
            "colorFilter"
        ).value;


    displayedCars =
        cars.filter(
            car => {


                const searchMatch =

                    !search ||

                    car.name
                        .toLowerCase()
                        .includes(search) ||

                    car.manufacturer
                        .toLowerCase()
                        .includes(search) ||

                    car.carBrand
                        .toLowerCase()
                        .includes(search);


                const manufacturerMatch =

                    !manufacturer ||

                    car.manufacturer ===
                    manufacturer;


                const brandMatch =

                    !brand ||

                    car.carBrand ===
                    brand;


                const colorMatch =

                    !color ||

                    car.color ===
                    color;


                return (

                    searchMatch &&

                    manufacturerMatch &&

                    brandMatch &&

                    colorMatch

                );

            }
        );


    renderCollection();

}


/* =====================================================
   COLLECTION GRID
===================================================== */

function renderCollection() {


    const grid =
        document.getElementById(
            "carGrid"
        );


    document.getElementById(
        "collectionCount"
    ).textContent =
        displayedCars.length;


    if (
        !displayedCars.length
    ) {


        grid.innerHTML = `

            <div class="no-results">

                No cars found.

            </div>

        `;


        return;

    }


    grid.innerHTML =

        displayedCars

            .map(
                car => `

                <div class="car-card">

                    <h3>

                        ${escapeHTML(
                            car.name
                        )}

                    </h3>


                    <div class="car-info">


                        ${
                            car.manufacturer

                            ? `

                                <span>

                                    <strong>

                                        ${escapeHTML(
                                            car.manufacturer
                                        )}

                                    </strong>

                                </span>

                              `

                            : ""

                        }


                        ${
                            car.carBrand

                            ? `

                                <span>

                                    ${escapeHTML(
                                        car.carBrand
                                    )}

                                </span>

                              `

                            : ""

                        }


                        ${
                            car.color

                            ? `

                                <span>

                                    <span
                                        class="color-dot"
                                    ></span>

                                    ${escapeHTML(
                                        car.color
                                    )}

                                </span>

                              `

                            : ""

                        }


                    </div>

                </div>

            `
            )

            .join("");

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
) {


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

   START

loadCSV();
